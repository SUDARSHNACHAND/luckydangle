<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucky Dangle Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #dangle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: transparent !important;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Canvas for dangling cord, beads, and charm -->
  <canvas id="dangle-canvas"></canvas>

  <script type="module" src="./src/overlay.js"></script>
</body>
</html>
