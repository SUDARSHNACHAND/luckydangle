<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucky Dangle Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #dangle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: transparent !important;
      z-index: 1;
    }

    /* Liquid Glass Floating Charm Model Switcher Pill Bar */
    .overlay-bar {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 35%, rgba(10, 14, 26, 0.82) 100%);
      backdrop-filter: blur(24px) saturate(200%) contrast(105%);
      -webkit-backdrop-filter: blur(24px) saturate(200%) contrast(105%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 4px 10px;
      z-index: 1000;
      opacity: 0.22;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      box-shadow: 
        0 10px 32px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -1px 2px 0 rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .overlay-bar:hover {
      opacity: 1;
      transform: translateX(-50%) translateY(2px);
      box-shadow: 
        0 14px 44px rgba(0, 0, 0, 0.72),
        inset 0 1px 2px 0 rgba(255, 255, 255, 0.55),
        0 0 22px rgba(139, 163, 248, 0.26),
        0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .model-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #e2e8f0;
      font-size: 1rem;
      padding: 3px 6px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .model-btn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 3px 8px rgba(0, 0, 0, 0.3);
      transform: scale(1.12);
    }

    .model-btn.active {
      background: linear-gradient(180deg, #4b6ef5 0%, #2644c9 100%);
      border-color: rgba(255, 255, 255, 0.45);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.65),
        0 2px 10px rgba(58, 90, 224, 0.5),
        0 0 16px rgba(75, 110, 245, 0.45);
      transform: scale(1.05);
    }

    .bar-sep {
      width: 1px;
      height: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.28) 50%, rgba(255, 255, 255, 0.05) 100%);
      margin: 0 2px;
    }

    .ritual-quick-btn {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.32) 0%, rgba(180, 83, 9, 0.36) 100%);
      color: #fef08a;
      border: 1px solid rgba(251, 191, 36, 0.45);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .ritual-quick-btn:hover {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6), 0 0 16px rgba(245, 158, 11, 0.65);
      transform: scale(1.05);
    }

    .sound-quick-btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.24);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 9px 4px 7px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .sound-quick-btn:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.1) 100%);
      border-color: rgba(255, 255, 255, 0.45);
      color: #ffffff;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 0 0 12px rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .sound-quick-btn.muted {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.28) 0%, rgba(185, 28, 28, 0.32) 100%);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fca5a5;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 0 10px rgba(239, 68, 68, 0.3);
    }

    .sound-quick-btn.muted:hover {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.45) 0%, rgba(185, 28, 28, 0.5) 100%);
      color: #ffffff;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4), 0 0 16px rgba(239, 68, 68, 0.5);
    }

    .sound-icon-svg {
      width: 15px;
      height: 15px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- Canvas for dangling cord, beads, and charm -->
  <canvas id="dangle-canvas"></canvas>

  <!-- Sleek Liquid Glass Floating Model Switcher Bar with All Charms + BMW Spinner + Ritual + Sound Toggle -->
  <div class="overlay-bar" id="overlay-bar">
    <button class="model-btn active" data-charm="bmw" title="BMW Symbol Spinner (Rev Engine)">
      <svg viewBox="0 0 24 24" width="16" height="16" style="display:inline-block; vertical-align:middle; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));">
        <circle cx="12" cy="12" r="11" fill="#050505" stroke="#e2e8f0" stroke-width="0.9"/>
        <circle cx="12" cy="12" r="7.5" fill="#ffffff" stroke="#94a3b8" stroke-width="0.5"/>
        <path d="M12,12 L12,4.5 A7.5,7.5 0 0,0 4.5,12 Z" fill="#0066b1"/>
        <path d="M12,12 L12,19.5 A7.5,7.5 0 0,0 19.5,12 Z" fill="#0066b1"/>
        <line x1="4.5" y1="12" x2="19.5" y2="12" stroke="#334155" stroke-width="0.6"/>
        <line x1="12" y1="4.5" x2="12" y2="19.5" stroke="#334155" stroke-width="0.6"/>
      </svg>
    </button>
    <button class="model-btn" data-charm="nimbu-mirchi" title="Nimbu-mirchi (Garland)">🌶️</button>
    <button class="model-btn" data-charm="maneki-neko" title="Maneki-neko (Beckoning Cat)">🐱</button>
    <button class="model-btn" data-charm="daruma" title="Daruma (Wishing Doll)">🎯</button>
    <button class="model-btn" data-charm="drishti-bommai" title="Drishti bommai (Guardian)">👹</button>
    <button class="model-btn" data-charm="chinese-knot" title="Páncháng jié (Chinese Knot)">🏮</button>
    <button class="model-btn" data-charm="himmeli" title="Himmeli (Geometric Mobile)">🌾</button>
    <button class="model-btn" data-charm="hamsa" title="Hamsa (Protection Palm)">✋</button>
    <button class="model-btn" data-charm="nazar" title="Nazar boncuğu (Evil Eye)">🧿</button>
    <button class="model-btn" data-charm="ghanta" title="Ghanta (Temple Bell)">🔔</button>
    <button class="model-btn" data-charm="custom" title="Custom Emoji">🍀</button>
    <div class="bar-sep"></div>
    <button class="ritual-quick-btn" id="overlay-ritual-btn" title="Perform Ritual (S)">✨ Ritual</button>
    <div class="bar-sep"></div>
    <button class="sound-quick-btn" id="overlay-sound-btn" title="Toggle Sound (M)">
      <svg class="sound-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <span class="sound-btn-text">Sound ON</span>
    </button>
  </div>

  <script type="module" src="./src/overlay.js"></script>
</body>
</html>
